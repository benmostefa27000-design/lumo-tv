name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler
        run: gradle --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk lumo-tv.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lumo 1.0.${{ github.run_number }}
          body: "Version 1.0.${{ github.run_number }} — ${{ github.event.head_commit.message }}"
          files: lumo-tv.apk
          make_latest: true
